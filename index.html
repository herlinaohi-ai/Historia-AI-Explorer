<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penjelajah AI Sejarah</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a33, #123c69);
      color: white;
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 60px 20px 30px;
    }

    h1 {
      color: #ffd166;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subjudul {
      font-size: 18px;
      line-height: 1.6;
    }

    .konten {
      background: white;
      color: #172033;
      margin: 20px;
      padding: 25px;
      border-radius: 18px;
    }

    input {
      width: 80%;
      max-width: 400px;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      background: #ffd166;
      color: #071a33;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffbd2e;
    }

    #pesan {
      margin-top: 18px;
      font-weight: bold;
      color: #123c69;
    }
  </style>
</head>

<body>
  <header>
    <h1>Penjelajah AI Sejarah</h1>
    <p class="subjudul">
      Multimedia Pembelajaran Interaktif<br>
      Materi Penelitian Sejarah Kelas X
    </p>
  </header>

  <main class="konten">
    <h2>Selamat Datang, Penjelajah Sejarah!</h2>

    <p>
      Masukkan nama untuk memulai perjalanan memahami
      langkah-langkah penelitian sejarah.
    </p>

    <input
      type="text"
      id="nama"
      placeholder="Tuliskan nama peserta didik"
    >

    <br>

    <button onclick="mulaiBelajar()">
      Mulai Menjelajah
    </button>

    <p id="pesan"></p>
  </main>

  <script>
    function mulaiBelajar() {
      const nama = document.getElementById("nama").value.trim();
      const pesan = document.getElementById("pesan");

      if (nama === "") {
        pesan.textContent = "Silakan masukkan nama terlebih dahulu.";
      } else {
        pesan.textContent =
          "Selamat datang, " + nama +
          "! Perjalanan sejarah siap dimulai.";
      }
    }
  
<section id="pilihanMisi" class="konten" style="display: none;">
  <h2>Pilih Misi Penelitian Sejarah</h2>

  <p>
    Selesaikan setiap misi secara berurutan untuk memahami
    tahapan penelitian sejarah.
  </p>

  <button onclick="bukaMisi(1)">
    Misi 1: Pemilihan Topik
  </button>

  <br>

  <button onclick="bukaMisi(2)">
    Misi 2: Heuristik
  </button>

  <br>

  <button onclick="bukaMisi(3)">
    Misi 3: Verifikasi
  </button>

  <br>

  <button onclick="bukaMisi(4)">
    Misi 4: Interpretasi dan Historiografi
  </button>

  <div id="materiMisi" style="margin-top: 25px;"></div>
</section>

<script>
  function mulaiBelajar() {
    const nama = document.getElementById("nama").value.trim();
    const pesan = document.getElementById("pesan");
    const pilihanMisi = document.getElementById("pilihanMisi");

    if (nama === "") {
      pesan.textContent = "Silakan masukkan nama terlebih dahulu.";
      return;
    }

    pesan.textContent =
      "Selamat datang, " + nama +
      "! Silakan memilih misi pertama.";

    pilihanMisi.style.display = "block";

    setTimeout(function () {
      pilihanMisi.scrollIntoView({
        behavior: "smooth"
      });
    }, 300);
  }

  function bukaMisi(nomor) {
    const materi = document.getElementById("materiMisi");

    if (nomor === 1) {
      materi.innerHTML = `
        <h3>Misi 1: Pemilihan Topik</h3>
        <p>
          Pilih topik sejarah yang menarik, penting, memiliki sumber,
          dan dapat diteliti.
        </p>
        <p>
          <strong>Tantangan:</strong> Tuliskan satu peristiwa sejarah
          lokal di Gorontalo yang ingin kamu teliti.
        </p>
      `;
    }

    if (nomor === 2) {
      materi.innerHTML = `
        <h3>Misi 2: Heuristik</h3>
        <p>
          Heuristik adalah kegiatan mencari dan mengumpulkan
          sumber-sumber sejarah.
        </p>
        <p>
          Sumber dapat berupa arsip, foto, surat kabar, benda,
          buku, dan wawancara.
        </p>
      `;
    }

    if (nomor === 3) {
      materi.innerHTML = `
        <h3>Misi 3: Verifikasi</h3>
        <p>
          Verifikasi adalah proses memeriksa keaslian dan
          kepercayaan sumber sejarah.
        </p>
        <p>
          Peneliti melakukan kritik eksternal dan kritik internal.
        </p>
      `;
    }

    if (nomor === 4) {
      materi.innerHTML = `
        <h3>Misi 4: Interpretasi dan Historiografi</h3>
        <p>
          Interpretasi adalah proses menafsirkan fakta sejarah.
          Historiografi adalah kegiatan menuliskan hasil penelitian
          sejarah secara runtut dan berdasarkan bukti.
        </p>
      `;
    }

    materi.scrollIntoView({
      behavior: "smooth"
    });
  }
</script>
